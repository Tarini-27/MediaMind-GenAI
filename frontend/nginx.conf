server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 110m;   # videos up to 100 MB

  # /api/* -> FastAPI (prefix stripped by the trailing slash)
  location /api/ {
    proxy_pass http://api:8000/;
    proxy_set_header Host $host;
  }
  location / { try_files $uri $uri/ /index.html; }
}

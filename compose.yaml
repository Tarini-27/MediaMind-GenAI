name: gather
x-gather: &gather
  build: .
  image: gather-local:0.2
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  read_only: true
  tmpfs: ["/tmp"]
services:
  api:
    <<: *gather
    ports: ["127.0.0.1:8765:8765"]
    environment:
      KNOWLEDGE_DATA_DIR: /data
      QDRANT_URL: http://qdrant:6333
      MCP_KNOWLEDGE_URL: http://knowledge:8902/mcp
      MCP_VALIDATION_URL: http://validation:8903/mcp
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      AGENT_MODEL: ${AGENT_MODEL:-}
      GUARD_MODEL: ${GUARD_MODEL:-}
      GUARD_API_KEY: ${GUARD_API_KEY:-}
    volumes: ["gather-data:/data", "model-cache:/models"]
    depends_on: [qdrant]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health')"]
      interval: 10s
      timeout: 4s
      retries: 12
  media:
    <<: *gather
    command: ["python", "-m", "capstone.mcp_servers", "media", "--port", "8901"]
    volumes: ["gather-data:/data:ro", "model-cache:/models"]
    depends_on:
      api: {condition: service_healthy}
  knowledge:
    <<: *gather
    command: ["python", "-m", "capstone.mcp_servers", "knowledge", "--port", "8902"]
    volumes: ["gather-data:/data:ro", "model-cache:/models"]
    depends_on:
      api: {condition: service_healthy}
  validation:
    <<: *gather
    command: ["python", "-m", "capstone.mcp_servers", "validation", "--port", "8903"]
    volumes: ["gather-data:/data:ro"]
    depends_on:
      api: {condition: service_healthy}
  actions:
    <<: *gather
    command: ["python", "-m", "capstone.mcp_servers", "actions", "--port", "8904"]
    volumes: ["gather-data:/data:ro"]
    depends_on:
      api: {condition: service_healthy}
  qdrant:
    image: qdrant/qdrant:v1.16.3
    volumes: ["vectors:/qdrant/storage"]
  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    ports: ["127.0.0.1:9090:9090"]
    volumes: ["./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro", "./ops/alerts.yml:/etc/prometheus/alerts.yml:ro", "prometheus-data:/prometheus"]
    depends_on: [api]
  grafana:
    image: grafana/grafana:12.1.0
    ports: ["127.0.0.1:3000:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes: ["./ops/grafana:/etc/grafana/provisioning:ro", "grafana-data:/var/lib/grafana"]
    depends_on: [prometheus]
volumes:
  gather-data:
  model-cache:
  vectors:
  prometheus-data:
  grafana-data:
